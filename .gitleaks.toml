title = "FMSC source secret checks"

[extend]
useDefault = true

# Default rules cover tokens, API credentials and private keys. Also flag
# literal passwords even when their entropy is too low for a generic API key.
[[rules]]
id = "fmsc-literal-password"
description = "A password is assigned a literal value"
regex = '''(?i)(?:["'](?:password|pwd)["']|\b(?:password|pwd))[ \t]*[:=][ \t]*["']([^\s"'][^"'\r\n]{3,})["']'''
secretGroup = 1
keywords = ["password", "pwd"]

[[rules.allowlists]]
description = "Exact existing synthetic WinForms/SQL fixture values, only in their test files"
condition = "AND"
paths = ['''^Tests/(?:AdministrationSqlChecks/Program\.cs|ThemeSmokeChecks/Program(?:\.Administration)?\.cs)$''']
regexTarget = "secret"
regexes = ['''^(?:Fixture password 12345|captured password)$''']

[[rules]]
id = "fmsc-connection-password"
description = "A SQL connection string contains a literal password"
regex = '''(?i)(?:server|data source|user id|uid)\s*=\s*[^"'\r\n]{0,300}?;\s*(?:password|pwd)\s*=\s*([^;"'\s\r\n]+)'''
secretGroup = 1
keywords = ["password", "pwd"]

[[rules.allowlists]]
description = "A C# interpolated variable is not a literal connection password"
regexTarget = "secret"
regexes = ['''^\{[A-Za-z_][A-Za-z0-9_.]*\}$''']


# The generated, record-free audit inventory is a CSV of Git object IDs.
# The generic API-key heuristic sees lines whose source path contains 'key'
# and mistakes adjacent 40-character blob SHA-1 IDs for credentials.
# Scope this exclusion to that exact generated inventory, that exact rule,
# and the Git-object-ID format. All other files/rules continue to be scanned.
[[allowlists]]
description = "Exact audit inventory Git blob SHA-1 identifiers, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^Audit/Inventories/FMSC_FILE_INVENTORY_2026-11-10\.csv$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{40}$''']

# Dropbox's PUBLIC OAuth app key (not a token or client secret) has the
# same syntax as the generic Dropbox token heuristic. Exempt only this
# publisher-registered value, only in the packaged provider-ID file, and
# only for the Dropbox token rule. All other findings must still fail CI.
[[allowlists]]
description = "Exact public FMSC Dropbox OAuth app key in provider registration only"
targetRules = ["dropbox-api-token"]
condition = "AND"
paths = ['''(?:^|/)CloudBackupProviders\.json
regexTarget = "secret"
regexes = ['''^0adfv6ob4m6pxca$''']
'']
regexTarget = "secret"
regexes = ['''^0adfv6ob4m6pxca$''']
