name: '17 - Maintenance - Private Update Feed Health'

on:
  push:
    paths:
      - '.github/workflows/fmsc-updates-feed-maintenance.yml'
  schedule:
    # Weekly Monday 04:13 UTC (09:13 Pakistan time).
    - cron: '13 4 * * 1'
  workflow_dispatch:

# Owner-only publishing credential has access to Updates.
# The Source GITHUB_TOKEN is never given private Updates permissions.
permissions:
  contents: read

concurrency:
  group: fmsc-private-feed-maintenance
  cancel-in-progress: false

jobs:
  verify-and-prune:
    if: github.repository_id == '1412760928' && github.repository_owner_id == '316891609' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Audit private update feed (read-only)
        uses: actions/github-script@v9
         with:
          github-token: ${{ secrets.FMSC_UPDATES_PUBLISH_TOKEN }}
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = 'FMSC-Updates';
            const { data: metadata } = await github.rest.repos.get({ owner, repo });
            if (String(metadata.id) !== '1445675367' ||
                String(metadata.owner.id) !== '316891609' ||
                !metadata.private || metadata.default_branch !== 'main') {
              throw new Error('Refusing maintenance: unexpected private update feed identity.');
            }
            const [{ data: main }, { data: channelFile }, { data: folders }] = await Promise.all([
              github.rest.repos.getBranch({ owner, repo, branch: 'main' }),
              github.rest.repos.getContent({ owner, repo, path: 'channel/stable.json', ref: 'main' }),
              github.rest.repos.getContent({ owner, repo, path: 'versions', ref: 'main' })
            ]);
            if (!Array.isArray(folders) || Array.isArray(channelFile) ||
                channelFile.type !== 'file') {
              throw new Error('The private update feed has an invalid tree layout.');
            }
            const channel = JSON.parse(Buffer.from(channelFile.content, 'base64').toString('utf8'));
            const names = folders.filter(x => x.type === 'dir').map(x => x.name).sort();
            if (channel.format !== 'fmsc-git-updates/v1' ||
                !names.includes(channel.latestVersion) ||
                (channel.previousVersion && !names.includes(channel.previousVersion)) ||
                names.length < 1 || names.length > 2) {
              throw new Error('Refusing cleanup: private feed versions or stable pointer are inconsistent.');
            }
            const [{ data: tip }, { data: listing }] = await Promise.all([
              github.rest.git.getCommit({ owner, repo, commit_sha: main.commit.sha }),
              github.rest.git.getTree({ owner, repo, tree_sha: main.commit.sha, recursive: 'true' })
            ]);
            if (listing.truncated) throw new Error('Cannot inventory a truncated feed tree.');
            const blobs = listing.tree.filter(x => x.type === 'blob' && x.path.startsWith('versions/'));
            const bytes = blobs.reduce((n, x) => n + (x.size || 0), 0);
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const extraBranches = branches.filter(b => b.name !== 'main');
            if (extraBranches.length) core.warning(
              `Private feed has ${extraBranches.length} non-main branch(es): ${extraBranches.map(b=>b.name).join(', ')}. Workflow 04 intentionally blocks root rotation until branches are reviewed and removed in the private repository.`);
            if (tip.parents.length !== 0) core.warning(
              'Update feed main has Git ancestors. Only Workflow 04 may perform verified root rotation.');
            const accepted = new Set(['README.md','channel/stable.json']);
            const unexpected = listing.tree.filter(item => item.type === 'blob' &&
              !accepted.has(item.path) &&
              !names.some(version => item.path.startsWith(`versions/${version}/`)));
            if (unexpected.length) core.warning(
              `Unexpected file(s) in release feed: ${unexpected.map(x=>x.path).join(', ')}`);
            await core.summary
              .addHeading('Private update feed health (read-only)')
              .addTable([
                [{data:'Measure',header:true},{data:'Value',header:true}],
                ['Active versions', names.join(', ')],
                ['Stable latest / previous', `${channel.latestVersion} / ${channel.previousVersion || '(none)'}`],
                ['Active package bytes (MiB)', (bytes / 1048576).toFixed(1)],
                ['GitHub reported repository (MiB)', (metadata.size / 1024).toFixed(1)],
                ['Git ancestors of current main', String(tip.parents.length)],
                ['Extra branches requiring review', String(extraBranches.length)],
                ['Unexpected release-feed files', String(unexpected.length)]
              ])
              .addRaw('This job is read-only. GitHub Git history garbage collection is server-managed; historical blob reclamation is not claimed. Workflow 04 alone owns protected, exact-SHA, root-history publication.\n')
              .write();
