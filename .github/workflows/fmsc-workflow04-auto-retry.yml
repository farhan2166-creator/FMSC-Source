name: '14 - Maintenance - Automatic Workflow 04 Retry'

# Runs independently after a completed owner-requested Workflow 04 failure.
# Never creates a fresh release request, changes Source/main or handles feed secrets.
on:
  workflow_run:
    workflows: ['04 - Build and Publish Private Update']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: fmsc-workflow04-autoretry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-failed-jobs:
    name: Retry failed release jobs at most twice, after 60 seconds
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository_id == '1412760928' &&
      github.repository_owner_id == '316891609' &&
      github.event.workflow_run.repository.id == 1412760928 &&
      github.event.workflow_run.actor.id == 316891609 &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Allow transient runner and service failures to recover
        shell: bash
        run: sleep 60
      - name: Revalidate the latest attempt, original owner and publication safety
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          [[ "$GITHUB_REPOSITORY_ID" == '1412760928' && "$GITHUB_REPOSITORY_OWNER_ID" == '316891609' ]] || exit 1
          api="repos/$repo"

          # Use the authenticated current run, not untrusted webhook text.
          run="$(gh api "$api/actions/runs/$RUN_ID")"
          if ! jq -e --argjson attempt "$EVENT_ATTEMPT" '
              .repository.id == 1412760928 and
              .repository.owner.id == 316891609 and
              .path == ".github/workflows/fmsc-windows-download.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .actor.id == 316891609 and
              .status == "completed" and
              .conclusion == "failure" and
              .run_attempt == $attempt and
              .run_attempt >= 1 and .run_attempt <= 2
            ' <<<"$run" >/dev/null; then
            echo 'No retry: run changed, already restarted, or not eligible.'
            exit 0
          fi

          # A later merge invalidates the release; allow only the original SHA
          # or the one-file version bump prepared by this same Workflow 04.
          original="$(jq -r '.head_sha' <<<"$run")"
          main="$(gh api "$api/branches/main" --jq '.commit.sha')"
          if [[ "$main" != "$original" ]]; then
            diff="$(gh api "$api/compare/$original...$main")"
            if ! jq -e '
                .ahead_by == 1 and .behind_by == 0 and
                (.files | length) == 1 and
                .files[0].filename == "Installer/core.ps1" and
                .files[0].status == "modified" and
                (.commits | length) == 1 and
                (.commits[0].commit.message | startswith("release: prepare FMSC "))
              ' <<<"$diff" >/dev/null; then
              echo 'No retry: Source/main changed beyond the expected release version bump.'
              exit 0
            fi
          fi

          # Automatic retries are permitted only while the publication job
          # has not executed at all. The parallel Windows verification/package
          # job is non-publishing and can be retried after transient failures.
          # GitHub step captions are not security identities: a harmless rename
          # must not hide publication. Unknown jobs, incomplete API pagination,
          # ambiguous steps or a started publisher all refuse the retry.
          jobs="$(gh api "$api/actions/runs/$RUN_ID/attempts/$EVENT_ATTEMPT/jobs?per_page=100")"
          if ! jq -e '
              (.jobs | type) == "array" and
              (.total_count | type) == "number" and
              .total_count == (.jobs | length) and
              ([.jobs[].name] | sort) == ([
                "Preflight, prepare or reuse next patch-version Source commit",
                "Require NEW private SQL, real installer and chaos acceptance",
                "Verify and package Windows x64",
                "Publish approved private update"
              ] | sort) and
              (all(.jobs[] | select(.name == "Publish approved private update");
                .conclusion == "skipped" and
                ((.steps // []) | all(.[]; .conclusion == "skipped"))))
            ' <<<"$jobs" >/dev/null; then
            echo 'No retry: publisher execution is possible or job evidence is incomplete; review private feed and run manually.'
            exit 0
          fi

          echo "Automatically retrying failed jobs: run $RUN_ID, attempt $EVENT_ATTEMPT of 3."
          gh api -X POST "$api/actions/runs/$RUN_ID/rerun-failed-jobs"
          {
            echo '## Workflow 04 automatic recovery'
            echo "- Run: https://github.com/$repo/actions/runs/$RUN_ID"
            echo "- Previous attempt: $EVENT_ATTEMPT"
            echo "- Retry starts after a one-minute delay."
            echo '- Maximum total attempts: 3 (original + 2 retries).'
            echo '- Release SHA and sandbox/publication safeguards remain unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
