          $db = Join-Path $root 'Database'
          New-Item -ItemType Directory -Path $db -Force | Out-Null
          @(
            'PLACE BOTH DETACHED DATABASE FILES IN THIS DIRECTORY AFTER DOWNLOADING:'
            ''
            '  FMSC_DB.mdf'
            '  FMSC_DB_log.ldf'
            ''
            'Do not rename the files. Make sure the pair belongs to the SAME verified'
            'detached school database snapshot. Never copy attached/live MDF/LDF files.'
            'Do not replace existing school data on a machine with an installed database.'
          ) | Set-Content -LiteralPath (Join-Path $db 'PUT_MDF_AND_LDF_HERE.txt') -Encoding UTF8

          @(
            'FMSC_SMS - FULL Windows x64 installer folder (database files not included)'
            ''
            'HOW TO PREPARE A FRESH INSTALL'
            '1. Extract this GitHub Actions ZIP completely.'
            '2. Copy your verified DETACHED database pair into the Database folder:'
            '      Database\FMSC_DB.mdf'
            '      Database\FMSC_DB_log.ldf'
            '3. Double-click "FMSC.Setup.exe" and approve the Windows administrator prompt.'
            '4. Follow the FMSC graphical installation progress; databases are protected.'
            ''
            'APPLICATION UPDATE WITHOUT REPLACING A SCHOOL DATABASE'
            'Do not put a new MDF/LDF over an existing installed school database.'
            "The installer and application require database schema $requiredSchema."
            'Only consecutive pending migrations may upgrade an older supported schema.'
            'A missing version stops before backup or SQL changes; newer databases refuse.'
            'For a fresh install, supply the latest compatible detached database pair.'
            ''
            'Includes the self-contained .NET 8 app and signed Microsoft Visual C++ v14 x64,'
